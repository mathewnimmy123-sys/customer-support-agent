# cloudbuild.yaml
steps:
  # STEP 1: Build the local workspace into an immutable Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-agent-container-image'
    args: [
      'build', 
      '-t', 'us-west1-docker.pkg.dev/$PROJECT_ID/agent-repository/customer-support-agent:$COMMIT_SHA', 
      '.'
    ]

  # STEP 2: Push the compiled image into the Artifact Registry (as shown in your diagram)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image-to-artifact-registry'
    args: [
      'push', 
      'us-west1-docker.pkg.dev/$PROJECT_ID/agent-repository/customer-support-agent:$COMMIT_SHA'
    ]

  # STEP 3: Deploy the image from Artifact Registry out to a Cloud Run Workload
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-workload-to-cloud-run'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'customer-support-agent-service',
      '--image', 'us-west1-docker.pkg.dev/$PROJECT_ID/agent-repository/customer-support-agent:$COMMIT_SHA',
      '--region', 'us-west1',
      '--platform', 'managed',
      '--allow-unauthenticated'
    ]

images:
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/agent-repository/customer-support-agent:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY