# cloudbuild.yaml — v3.4 (Quiet Dependencies)
steps:
  - name: 'python:3.12-slim'
    id: 'deploy-to-agent-engine'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        echo "==> Step 1: Initialize Environment Constraints"
        echo "packaging==24.2" > /constraints.txt

        echo "==> Step 2: Upgrading base installer tools"
        pip install -q --no-cache-dir setuptools wheel --constraint /constraints.txt

        echo "==> Step 3: Pin target packaging layer"
        pip install -q --no-cache-dir "packaging==24.2"

        echo "==> Step 4: Core Engine Mismatch Remediation"
        pip install -q --no-cache-dir --upgrade \
          google-api-core \
          googleapis-common-protos \
          --constraint /constraints.txt

        echo "==> Step 5: Install Synchronized Vertex AI SDK"
        pip install -q --no-cache-dir \
          "google-cloud-aiplatform[agent_engines]==1.71.1" \
          "vertexai==1.71.1" \
          --constraint /constraints.txt

        echo "==> Step 6: Install remaining project requirements"
        pip install -q --no-cache-dir \
          "google-adk[agent-identity,a2a]>=0.5.0" \
          "mcp>=1.0.0" \
          "google-cloud-bigquery>=3.0.0" \
          "google-auth>=2.0.0" \
          "aiohttp>=3.10.0,<3.11.0" \
          "pydantic>=2.10.0,<3.0.0" \
          --constraint /constraints.txt

        echo "==> Verification: Check imports"
        python3 -c "import packaging; print('packaging version:', packaging.__version__)"
        python3 -c "import vertexai; print('vertexai status: OK')"

        echo "==> Execution: Running deploy.py"
        python3 deploy.py

timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY
