# cloudbuild.yaml — v3.3 (Runtime Transport Fix)
steps:
  - name: 'python:3.12-slim'
    id: 'deploy-to-agent-engine'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        echo "==> Step 1: Write constraints file FIRST"
        echo "packaging==24.2" > /constraints.txt

        echo "==> Step 2: Upgrade pip tools (without touching packaging)"
        pip install --no-cache-dir setuptools wheel --constraint /constraints.txt

        echo "==> Step 3: Pin packaging==24.2 explicitly"
        pip install --no-cache-dir "packaging==24.2"

        echo "==> Step 4: Install Synchronized Vertex AI SDK with Agent Engines Support"
        pip install --no-cache-dir \
          "google-cloud-aiplatform[agent_engines]==1.71.1" \
          "vertexai==1.71.1" \
          --constraint /constraints.txt

        echo "==> Step 5: Install project requirements"
        pip install --no-cache-dir \
          "google-adk[agent-identity,a2a]>=0.5.0" \
          "mcp>=1.0.0" \
          "google-cloud-bigquery>=3.0.0" \
          "google-auth>=2.0.0" \
          "aiohttp>=3.10.0,<3.11.0" \
          "pydantic>=2.10.0,<3.0.0" \
          --constraint /constraints.txt

        echo "==> Step 6: Upgrade foundational API cores to prevent transport runtime mismatch"
        pip install --no-cache-dir --upgrade \
          google-api-core \
          googleapis-common-protos \
          --constraint /constraints.txt

        echo "==> Verifying packaging version (must be 24.2):"
        python3 -c "import packaging; print('packaging version:', packaging.__version__)"

        echo "==> Verifying vertexai imports cleanly:"
        python3 -c "import vertexai; print('vertexai OK')"

        echo "==> Running deployment:"
        python3 deploy.py

timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY
