steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-agent-container-image'
    args:
      - 'build'
      - '-t'
      - 'us-west1-docker.pkg.dev/gci-techss-gcp-pjnp-01nl165115/agent-repository/customer-support-agent:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-agent-container-image'
    args:
      - 'push'
      - 'us-west1-docker.pkg.dev/gci-techss-gcp-pjnp-01nl165115/agent-repository/customer-support-agent:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-agent-service'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'customer-support-agent-service'
      - '--image'
      - 'us-west1-docker.pkg.dev/gci-techss-gcp-pjnp-01nl165115/agent-repository/customer-support-agent:latest'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'us-west1-docker.pkg.dev/gci-techss-gcp-pjnp-01nl165115/agent-repository/customer-support-agent:latest'

options:
  logging: CLOUD_LOGGING_ONLY
